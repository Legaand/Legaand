<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 110" width="700" height="110" role="img" aria-label="Legend Yang">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E1F2B"/>
      <stop offset="0.55" stop-color="#8E1F2B"/>
      <stop offset="1" stop-color="#5E1019"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B0182B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#B0182B" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <ellipse cx="350" cy="58" rx="300" ry="42" fill="url(#halo)"/>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="7" text-anchor="middle">
    <text x="350" y="72" fill="#E8C9A0" fill-opacity="0.9">LEGEND YANG</text>
    <text x="350" y="70" fill="url(#ink)" filter="url(#lift)">LEGEND YANG</text>
  </g>
</svg>
