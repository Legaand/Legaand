<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Legend Yang — Software Engineer, Mathematics of Computation at UCLA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0A0D12"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="230" fill="url(#bg)"/>
  <rect width="1200" height="230" fill="url(#halo)"/>

  <!-- faint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 70 H1200 M0 140 H1200"/>
    <path d="M300 0 V230 M600 0 V230 M900 0 V230"/>
  </g>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="106" fill="#E6EDF3" font-size="62" font-weight="700" letter-spacing="1.5">Legend Yang</text>
    <rect x="74" y="128" width="220" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="72" y="176" fill="#B6C2CF" font-size="25" font-weight="500">Software Engineer &#183; Mathematics of Computation @ UCLA</text>
  </g>
</svg>
