<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 16" width="1200" height="16" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969DA" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#0969DA" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#0969DA" stop-opacity="0.65"/>
      <stop offset="0.65" stop-color="#0969DA" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0969DA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#218BFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#218BFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#218BFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="7.25" width="1200" height="1.5" fill="url(#line)"/>

  <rect y="7.25" width="220" height="1.5" fill="url(#shine)">
    <animate attributeName="x" from="-220" to="1200" dur="7s" repeatCount="indefinite"/>
  </rect>

  <rect x="594" y="2" width="12" height="12" transform="rotate(45 600 8)" fill="#FFFFFF" stroke="#0969DA" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
