<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Legend Yang — engineer, researcher, card magician">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFAF6"/>
      <stop offset="1" stop-color="#F1EDE4"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#B4790B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#B4790B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14141A"/>
      <stop offset="1" stop-color="#3A3A46"/>
    </linearGradient>

    <!-- one card back, reused -->
    <symbol id="back" viewBox="0 0 120 168">
      <rect x="0" y="0" width="120" height="168" rx="9" fill="#F6F1E7"/>
      <rect x="6" y="6" width="108" height="156" rx="6" fill="#8E1F2B"/>
      <rect x="11" y="11" width="98" height="146" rx="4" fill="none" stroke="#F6F1E7" stroke-opacity="0.55" stroke-width="1"/>
      <rect x="15" y="15" width="90" height="138" rx="3" fill="none" stroke="#F6F1E7" stroke-opacity="0.28" stroke-width="0.6"/>
      <g stroke="#F6F1E7" stroke-opacity="0.16" stroke-width="0.7">
        <path d="M15 39 L105 39 M15 63 L105 63 M15 87 L105 87 M15 111 L105 111 M15 135 L105 135"/>
        <path d="M33 15 L33 153 M51 15 L51 153 M69 15 L69 153 M87 15 L87 153"/>
        <path d="M15 15 L105 105 M15 63 L105 153 M105 15 L15 105 M105 63 L15 153"/>
      </g>
      <g fill="none" stroke="#F6F1E7" stroke-opacity="0.5">
        <circle cx="60" cy="84" r="26" stroke-width="1.2"/>
        <circle cx="60" cy="84" r="19" stroke-width="0.6"/>
        <g stroke-width="0.7">
          <path d="M60 58 L60 110 M34 84 L86 84 M42 66 L78 102 M78 66 L42 102"/>
          <path d="M46 61 L74 107 M74 61 L46 107 M37 70 L83 98 M83 70 L37 98"/>
        </g>
      </g>
      <circle cx="60" cy="84" r="7" fill="#F6F1E7" fill-opacity="0.85"/>
      <path d="M60 80.5 c-1.6-2.6-5.4-2-5.4 1 0 2.4 3.2 4.4 5.4 6.3 2.2-1.9 5.4-3.9 5.4-6.3 0-3-3.8-3.6-5.4-1z" fill="#8E1F2B"/>
    </symbol>

    <!-- travelling shine, clipped to the fan -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="fanClip">
      <rect x="700" y="0" width="500" height="320"/>
    </clipPath>

    <style>
      /* NOTE: a CSS transform overrides the SVG transform attribute on the same
         element, so every animated node here is a bare wrapper — the static
         rotate/translate that places a card lives on its parent. */
      .bob { animation: bob 6s ease-in-out infinite; transform-origin: 60px 168px; transform-box: fill-box; }
      .d1 { animation-delay: -0.30s; }
      .d2 { animation-delay: -0.60s; }
      .d3 { animation-delay: -0.90s; }
      .d4 { animation-delay: -1.20s; }
      @keyframes bob { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-8px) rotate(-1.1deg); } }
      /* stays inside #fanClip at every keyframe and fades at both ends —
         a hard-edged rect crossing the clip boundary shows as a seam. */
      .sweep { animation: sweep 5.5s ease-in-out infinite; }
      @keyframes sweep {
        0%   { transform: translateX(0) skewX(-14deg); opacity: 0; }
        14%  { opacity: 1; }
        46%  { opacity: 1; }
        60%, 100% { transform: translateX(390px) skewX(-14deg); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .bob, .sweep { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="320" rx="14" fill="url(#ground)"/>
  <rect width="1200" height="320" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#D9D2C4"/>

  <!-- eyebrow -->
  <g transform="translate(64 92)">
    <path d="M0 -5.5 c-2.6-4.2-8.8-3.2-8.8 1.6 0 3.9 5.2 7.1 8.8 10.2 3.6-3.1 8.8-6.3 8.8-10.2 0-4.8-6.2-5.8-8.8-1.6z" fill="#F43F5E" transform="translate(9 0)"/>
    <text x="30" y="5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="4.5" fill="#9A6608">LEGEND&#160;YANG</text>
  </g>

  <!-- name -->
  <text x="62" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" letter-spacing="-1" fill="url(#nameFill)">Sleight&#160;of&#160;hand,</text>
  <text x="62" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" letter-spacing="-1" fill="#9A6608">shipped&#160;as&#160;code.</text>

  <!-- rule + subline -->
  <path d="M64 268 L636 268" stroke="#D9D2C4"/>
  <text x="64" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2.2" fill="#6B6B76">UCLA&#160;&#160;·&#160;&#160;MATH&#8211;ECON&#160;&#160;·&#160;&#160;ML&#160;RESEARCH&#160;&#160;·&#160;&#160;CARD&#160;MAGICIAN</text>

  <!-- the fan -->
  <g clip-path="url(#fanClip)">
    <g transform="rotate(-34 940 300) translate(880 132)"><g class="bob d4"><use href="#back" width="120" height="168" opacity="0.9"/></g></g>
    <g transform="rotate(-17 940 300) translate(880 132)"><g class="bob d3"><use href="#back" width="120" height="168" opacity="0.94"/></g></g>
    <g transform="translate(880 132)"><g class="bob d2"><use href="#back" width="120" height="168"/></g></g>
    <g transform="rotate(17 940 300) translate(880 132)"><g class="bob d1"><use href="#back" width="120" height="168" opacity="0.94"/></g></g>

    <!-- face-up ace, front of the fan -->
    <g transform="rotate(34 940 300) translate(880 132)">
      <g class="bob">
        <rect width="120" height="168" rx="9" fill="#F6F1E7"/>
        <rect x="4" y="4" width="112" height="160" rx="6" fill="none" stroke="#C9BFAB" stroke-width="0.8"/>
        <g fill="#C1121F" font-family="Georgia, serif" font-size="19" font-weight="700">
          <text x="12" y="26">A</text>
          <text x="108" y="152" transform="rotate(180 104 146)">A</text>
        </g>
        <path d="M18 30 c-1.9-3.1-6.5-2.4-6.5 1.2 0 2.9 3.9 5.3 6.5 7.6 2.6-2.3 6.5-4.7 6.5-7.6 0-3.6-4.6-4.3-6.5-1.2z" fill="#C1121F"/>
        <path d="M102 138 c1.9 3.1 6.5 2.4 6.5-1.2 0-2.9-3.9-5.3-6.5-7.6-2.6 2.3-6.5 4.7-6.5 7.6 0 3.6 4.6 4.3 6.5 1.2z" fill="#C1121F"/>
        <path d="M60 62 c-8-13-27-10-27 5 0 12 16 22 27 32 11-10 27-20 27-32 0-15-19-18-27-5z" fill="#C1121F"/>
      </g>
    </g>

    <rect class="sweep" x="712" y="-40" width="90" height="400" fill="url(#shine)"/>
  </g>
</svg>
