<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Legend Yang — Software Engineer, Mathematics of Computation at UCLA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F5F9"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969DA"/>
      <stop offset="1" stop-color="#0969DA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#0969DA" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0969DA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#halo)"/>

  <!-- faint grid -->
  <g stroke="#0D1117" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200"/>
    <path d="M300 0 V280 M600 0 V280 M900 0 V280"/>
  </g>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="106" fill="#0D1117" font-size="62" font-weight="700" letter-spacing="1.5">Legend Yang</text>
    <rect x="74" y="128" width="220" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="72" y="176" fill="#3D444D" font-size="25" font-weight="500">Software Engineer &#183; Mathematics of Computation @ UCLA</text>
    <text x="72" y="216" fill="#6E7781" font-size="19" font-weight="400">Distributed systems, retrieval &amp; applied AI &#183; Los Angeles</text>
  </g>
</svg>
